# Disposable, local image verification only. This is not an Azure deployment file.
name: alphaforge-image-smoke

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: alphaforge_smoke
      POSTGRES_USER: alphaforge_smoke
      POSTGRES_PASSWORD: local-smoke-only
    # No development volume and no database port published to the host.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaforge_smoke -d alphaforge_smoke"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    image: ${BACKEND_IMAGE:-alphaforge-backend:local}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The temporary database has no TLS; production image defaults stay unchanged.
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/alphaforge_smoke
      DB_USERNAME: alphaforge_smoke
      DB_PASSWORD: local-smoke-only
      DEV_SEED_DATA_ENABLED: "false"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
