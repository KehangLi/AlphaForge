services:
  postgres:
    image: postgres:16
    container_name: alphaforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-alphaforgeUser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alphaforgePass}
      POSTGRES_DB: ${DB_NAME:-alphaforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:


# Start services: docker compose up -d
# Remove containers while preserving the data volume: docker compose down
# Start or stop existing containers: docker compose start / docker compose stop


# Open psql: docker compose exec postgres psql -U alphaforgeUser -d alphaforge
# Exit psql with \q.
