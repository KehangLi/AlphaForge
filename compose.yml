services:
  postgres:
    image: postgres:16
    container_name: alphaforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-alphaforgeUser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alphaforgePass}
      POSTGRES_DB: ${DB_NAME:-alphaforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:


# docker compose up -d    启动服务
# docker compose down     停止并删除container 但是数据还在
# docker compose start/stop
