name: Show Deployment Identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: backend-production
    permissions:
      id-token: write
    steps:
      - name: Show only public OIDC claims for Azure setup
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=api://AzureADTokenExchange'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req, timeout=30) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          lines = ['## Azure federated identity values', '']
          for key in ('iss', 'aud', 'sub', 'repository', 'ref'):
              lines.append(f'- {key}: `{claims[key]}`')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          print('Public identity values are in the run summary. No token was printed.')
          PY
