spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alphaforge}
    username: ${DB_USERNAME:alphaforgeUser}
    password: ${DB_PASSWORD:alphaforgePass}

alphaforge:
  dev:
    seed-data:
      enabled: ${DEV_SEED_DATA_ENABLED:true}
    user:
      email: ${DEV_USER_EMAIL:dev@alphaforge.local}
      display-name: ${DEV_USER_DISPLAY_NAME:Local Dev User}
    brokerage-account-long:
      broker-name: ${DEV_BROKER_NAME:Trading 212}
      account-name: ${DEV_BROKERAGE_ACCOUNT_NAME:Main brokerage}
      base-currency: ${DEV_BASE_CURRENCY:EUR}
    brokerage-account-short:
      broker-name: ${DEV_BROKER_NAME:Trading 212}
      account-name: ${DEV_BROKERAGE_ACCOUNT_NAME:Long term}
      base-currency: ${DEV_BASE_CURRENCY:EUR}
