spring:
  application:
    name: AlphaForge
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    timeout: ${SESSION_TIMEOUT:24h}
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        name: ALPHAFORGE_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
